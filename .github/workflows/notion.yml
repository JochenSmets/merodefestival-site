name: Notion → website

on:
  schedule:
    - cron: "7 * * * *"   # elk uur
  workflow_dispatch:       # knop "Run workflow" om meteen te publiceren

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp@0.33.5
      - run: node scripts/sync-notion.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          AGENDA_DB: ${{ secrets.AGENDA_DB }}
          PRODUCTIES_DB: ${{ secrets.PRODUCTIES_DB }}
          BEELDBANK_DB: ${{ secrets.BEELDBANK_DB }}
      - run: node scripts/build-pages.mjs
        env:
          SITE_URL: https://www.merodefestival.be
      - name: Wijzigingen bewaren
        run: |
          git config user.name "website-bot"
          git config user.email "website-bot@users.noreply.github.com"
          git add site
          git diff --cached --quiet || (git commit -m "Update uit Notion" && git push)
